# Render Blueprint: deploy apenas o worker.
# O web service "cade-o-circular" ja existe no seu projeto, entao
# basta adicionar as env vars WORKER_URL e WORKER_API_KEY nele manualmente.
#
# IMPORTANTE:
# - O worker PRECISA estar em uma regiao/IP que a SPTrans nao tenha banido.
# - Se a regiao abaixo for bloqueada, recrie o worker em outra regiao
#   (singapore, ohio, virginia) ou use um VPS externo.

services:
  - type: web
    name: cade-o-circular-worker
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: SPTRANS_API_KEY
        sync: false
      - key: WORKER_API_KEY
        generateValue: true
