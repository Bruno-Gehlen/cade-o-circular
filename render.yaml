# Render Blueprint: projeto completo "circular" com web service + worker.
# Ao criar a Blueprint Instance, escolha o nome do projeto "circular".
# O blueprint cria:
#   - cade-o-circular        (web service, servindo o frontend e /api/*)
#   - cade-o-circular-worker (worker que fala com a SPTrans)
#
# IMPORTANTE:
# - O worker PRECISA estar em uma regiao/IP que a SPTrans nao tenha banido.
# - Se Frankfurt for bloqueada, mude a regiao do worker para singapore ou ohio.
# - Apos o deploy, preencha WORKER_URL no web service com a URL real do worker
#   (o Render pode adicionar um sufixo como -gs36 se o nome estiver ocupado).
# - Apos o deploy, aponte o dominio customizado cade-o-circular.com para o
#   web service "cade-o-circular" no dashboard da Render.

services:
  - type: web
    name: cade-o-circular
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: WORKER_URL
        sync: false
      - key: WORKER_API_KEY
        generateValue: true

  - type: web
    name: cade-o-circular-worker
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: SPTRANS_API_KEY
        sync: false
      - key: WORKER_API_KEY
        fromService:
          type: web
          name: cade-o-circular
          envVarKey: WORKER_API_KEY
