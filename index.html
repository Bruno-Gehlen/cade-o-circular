<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USP Butantã - Rastreamento de Ônibus em Tempo Real</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body data-color-scheme="dark">
    <!-- Loading Overlay -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="loading-spinner"></div>
        <p>Carregando dados dos ônibus...</p>
    </div>

    <!-- Top Control Bar -->
    <div class="top-controls">
        <div class="control-group">
            <button id="theme-toggle" class="btn btn--secondary control-btn">
                <span class="theme-icon">🌙</span>
                <span class="btn-text">Alternar Tema</span>
            </button>
            <button id="find-location" class="btn btn--secondary control-btn">
                <span>📍</span>
                <span class="btn-text">Minha Localização</span>
            </button>
            <button id="center-usp" class="btn btn--secondary control-btn">
                <span>🎓</span>
                <span class="btn-text">Panorama USP</span>
            </button>   
        </div>
        <div class="api-status">
            <span id="connection-status" class="status status--info">Conectando...</span>
            <span id="last-update">Nunca atualizado</span>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>Linhas de Ônibus USP</h3>
            <button type="button" id="sidebar-toggle" class="sidebar-toggle">◀️</button>
        </div>
        
        <div class="sidebar-content">
            <!-- <div class="api-config-section">
                <div class="form-group">
                    <input type="password" id="api-key" class="form-control" placeholder="Cole sua chave da API aqui">
                    <button id="connect-api" class="btn btn--primary btn--sm" style="margin-top: 8px;">Conectar</button>
                </div>
            </div> -->

            <div class="bus-lines-section">
                <h4>Selecione as Linhas</h4>
                <div id="bus-lines-container">
                    <!-- Bus line checkboxes will be populated by JavaScript -->
                </div>
                
                <div class="line-actions">
                    <button id="select-all" class="btn btn--outline btn--sm">Selecionar Todas</button>
                    <button id="clear-all" class="btn btn--outline btn--sm">Limpar Tudo</button>
                </div>
            </div>

            <div class="update-info">
                <p><strong>Atualização automática:</strong> A cada 30 segundos</p>
                <button id="manual-refresh" class="btn btn--primary btn--sm btn--full-width">Atualizar Agora</button>
            </div>
        </div>
    </div>
    <div id="sidebar-drag-handle" class="sidebar-drag-handle"></div>

    <!-- Main Map Container -->
    <div class="map-container">
        <div id="map"></div>
    </div>

    <!-- Bottom Info Panel -->
    <div class="bottom-panel" id="bottom-panel">
        <div class="panel-header">
            <h4>Informações dos Ônibus</h4>
            <button id="panel-toggle" class="panel-toggle">🔽</button>
        </div>
        <div class="panel-content" id="panel-content">
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">Linhas Ativas</span>
                    <span class="stat-value" id="active-lines">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Ônibus no Mapa</span>
                    <span class="stat-value" id="total-buses">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Última Atualização</span>
                    <span class="stat-value" id="update-time">-</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Tempo de Espera</span>
                    <span class="stat-value" id="waiting-time" style="font-size: small;">Em breve</span>
                    <span class="stat-value" id="waiting-time" style="font-size: small;">to fazendo...</span>
                </div>
            </div>
            <div id="selected-bus-info" class="selected-bus-info" style="display: none;">
                <h5>Ônibus Selecionado</h5>
                <div id="bus-details"></div>
            </div>
        </div>
    </div>

    <!-- Error Toast -->
    <div id="error-toast" class="error-toast hidden">
        <div class="toast-content">
            <span class="toast-icon">⚠️</span>
            <span class="toast-message" id="toast-message"></span>
            <button class="toast-close" id="toast-close">✕</button>
        </div>
    </div>

    <!-- Success Toast -->
    <div id="success-toast" class="success-toast hidden">
        <div class="toast-content">
            <span class="toast-icon">✅</span>
            <span class="toast-message" id="success-message"></span>
            <button class="toast-close" id="success-close">✕</button>
        </div>
    </div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="app.js"></script>
</body>
</html>
